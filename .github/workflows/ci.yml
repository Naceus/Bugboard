name: CI
on: 
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup .NET 
        uses: actions/setup-dotnet@v5
        with: 
          dotnet-version: '8.0.x'
      - name: Restore dependencies
        run: dotnet restore BugBoard.slnx
      - name: Build application
        run: dotnet build BugBoard.slnx --configuration Release --no-restore
      - name: Run tests
        run: dotnet test BugBoard.slnx --configuration Release --no-restore